<!DOCTYPE html>
<html lang="en">

<head>
  <!-- First element in <head>: a CSP meta only governs resources the parser
       reaches after it. Carries the policy on the surfaces that have no
       response headers of our own (iOS capacitor://localhost); on the hosted
       PWA it coexists with the vercel.json header, which adds the
       header-only directives (frame-ancestors, upgrade-insecure-requests).
       Keep the shared directives byte-identical with vercel.json and
       glow-app's capacitor.config.ts. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https: wss:; worker-src 'self' blob:; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; manifest-src 'self'" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  
  <!-- PWA Meta Tags -->
  <meta name="application-name" content="Glow" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Glow" />
  <meta name="mobile-web-app-capable" content="yes" />
  <!-- Glow is dark-only. Declaring the color scheme stops Chrome from
       adapting standalone PWA chrome to the system theme: without it,
       Light mode renders a white navigation bar and Dark mode swaps
       theme-color for Chrome's own near-black. -->
  <meta name="color-scheme" content="dark" />
  <!-- #13131d = spark-surface at 80% composited over the void canvas:
       the same value the native app pins its system bars to (main.tsx),
       so PWA system bars blend with the header / bottom-bar glass. The
       media-qualified pair pins the same color in both system themes. -->
  <meta name="theme-color" content="#13131d" />
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#13131d" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#13131d" />
  <meta name="msapplication-TileColor" content="#0a0a0f" />
  <meta name="msapplication-tap-highlight" content="no" />
  
  <!-- Description -->
  <meta name="description" content="Glow is a bitcoin app for everyone. Everyday payments in bitcoin or USD, built in the open on the Breez SDK. Download it, fork it, make it your own." />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://glow-app.co/" />
  <meta property="og:title" content="Glow: A Bitcoin App for Everyone" />
  <meta property="og:description" content="Glow is a bitcoin app for everyone. Everyday payments in bitcoin or USD, built in the open on the Breez SDK. Download it, fork it, make it your own." />
  <meta property="og:image" content="https://glow-app.co/og-image.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Glow: A Bitcoin App for Everyone" />
  <meta name="twitter:description" content="Glow is a bitcoin app for everyone. Everyday payments in bitcoin or USD, built in the open on the Breez SDK." />
  <meta name="twitter:image" content="https://glow-app.co/og-image.jpg" />
  
  <!-- Icons -->
  <link rel="icon" type="image/svg+xml" href="/assets/Glow_Logo.svg" />
  <link rel="icon" type="image/png" href="/icons/Glow_favicon.png" />
  <link rel="apple-touch-icon" href="/icons/Glow-icon-maskable-192.png" />
  <link rel="mask-icon" href="/icons/Glow-icon-maskable-192.png" color="#0a0a0f" />
  <!-- iOS standalone launch images. Without these iOS shows a blank
       scheme-colored frame (a black flash on this app) before first
       paint; background_color in the manifest is ignored. Canvas is
       #0f0f18 (spark-dark) so startup image, #splash spinner page,
       and the welcome page all share one canvas color; logo in the same
       144pt box as .splash-logo so the handoff does not resize it. iOS
       requires an exact device-size + DPR + orientation match per image
       (portrait-only set; the app is portrait-designed). Regenerate with
       scripts/generate-apple-splash.js. -->
  <link rel="apple-touch-startup-image" media="screen and (device-width: 320px) and (device-height: 568px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="/apple-splash/apple-splash-320x568@2.png" />
  <link rel="apple-touch-startup-image" media="screen and (device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="/apple-splash/apple-splash-375x667@2.png" />
  <link rel="apple-touch-startup-image" media="screen and (device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/apple-splash/apple-splash-375x812@3.png" />
  <link rel="apple-touch-startup-image" media="screen and (device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/apple-splash/apple-splash-390x844@3.png" />
  <link rel="apple-touch-startup-image" media="screen and (device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/apple-splash/apple-splash-393x852@3.png" />
  <link rel="apple-touch-startup-image" media="screen and (device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/apple-splash/apple-splash-402x874@3.png" />
  <link rel="apple-touch-startup-image" media="screen and (device-width: 414px) and (device-height: 736px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/apple-splash/apple-splash-414x736@3.png" />
  <link rel="apple-touch-startup-image" media="screen and (device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="/apple-splash/apple-splash-414x896@2.png" />
  <link rel="apple-touch-startup-image" media="screen and (device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/apple-splash/apple-splash-414x896@3.png" />
  <link rel="apple-touch-startup-image" media="screen and (device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/apple-splash/apple-splash-428x926@3.png" />
  <link rel="apple-touch-startup-image" media="screen and (device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/apple-splash/apple-splash-430x932@3.png" />
  <link rel="apple-touch-startup-image" media="screen and (device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/apple-splash/apple-splash-440x956@3.png" />

  
  <!-- Manifest -->
  <link rel="manifest" href="/manifest.json" />

  <title>Glow: A Bitcoin App for Everyone</title>

  <!-- Fonts (Plus Jakarta Sans for UI, JetBrains Mono for numbers) are
       self-hosted and bundled via @fontsource, imported from src/index.css.
       They used to load from fonts.googleapis.com here, which put a
       third-party network round trip on the first-paint path of a native
       app and broke first paint offline. -->

  <!-- Initial loading styles -->
  <style>
    /* Prevent pull-to-refresh on iOS */
    html, body {
      overscroll-behavior-y: none;
      background: #0f0f18; /* spark-dark: same canvas as the welcome page */
    }

    /* Initial splash screen. Fade-out is driven by the Web Animations
       API in main.tsx's hideSplash() — not a CSS class toggle — because
       `transitionend` proved unreliable on Android WebView and left the
       splash visibly racing the biometric prompt during unlock. */
    #splash {
      position: fixed;
      inset: 0;
      background: #0f0f18;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }
    
    /* Glow logo, not a spinner: this page is the continuation of the
       native splash (same canvas), so the launch reads as one splash
       until the wallet is ready. Sign-of-life for the long tail comes
       from the wallet page itself once it reveals.

       144px, not a vw fraction: the native splash marks are absolute
       (Android 12+ specs its splash icon in dp, and the iOS launch
       screen is pinned to the same box), so a viewport-relative size
       here can only agree with them at one screen width and visibly
       resizes the mark at the handoff everywhere else. Every logo on
       the launch path is this same 144 box: LockScreen, PinEntry,
       UnlockPage, UnlockingPage, HomePage. */
    .splash-logo {
      width: 144px;
      height: 144px;
      object-fit: contain;
    }
  </style>
</head>

<body>
  <!-- Splash screen shown during initial load -->
  <div id="splash">
    <img class="splash-logo" src="/assets/Glow_Logo.svg" alt="" />
  </div>
  
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
  
  <script src="/sw-register.js" defer></script>
</body>

</html>
